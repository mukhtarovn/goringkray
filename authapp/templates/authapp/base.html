{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
            {{ title|upper }}
        {% endblock %}
    </title>

    {% block css %}
        <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
        <link rel="stylesheet" href="{% static 'fonts/font-awesome/css/font-awesome.css' %}">
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Neucha&family=Orelega+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    {% endblock %}

    <!-- Yandex.Metrika counter -->
    <script type="text/javascript">
       (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
       m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
       (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

       ym(87808261, "init", {
            clickmap:true,
            trackLinks:true,
            accurateTrackBounce:true
       });
    </script>
    <noscript>
        <div>
            <img src="https://mc.yandex.ru/watch/87808261" style="position:absolute; left:-9999px;" alt="" />
        </div>
    </noscript>
    <!-- /Yandex.Metrika counter -->
</head>

<body class="site-body auth-page-body">

    <div class="hero-white">
        <div class="top-bar">
            <div class="logo-left">
                <a href="{% url 'main' %}">
                    <img src="{% static 'img/gorniy_kray_logo.png' %}" alt="Горный край">
                </a>
            </div>

            <nav class="main-nav">
                <ul class="main-nav-list">
                    <li><a href="{% url 'main' %}">Главная</a></li>
                    <li><a href="{% url 'products:index' %}">Каталог</a></li>
                    <li><a href="{% url 'contacts' %}">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <main class="site-main">
        <div class="site-container">
            <div class="auth-layout">
                <div class="auth-card">
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
        </div>
    </main>

</body>
</html>
