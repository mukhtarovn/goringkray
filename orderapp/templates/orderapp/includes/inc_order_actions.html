{% if object.status == 'FM' %}

<div class="actions-card">

    <a href="{% url 'orderapp:order_forming_complete' object.pk %}" class="btn-primary">
        Купить
    </a>

    <div class="secondary-actions">

        <a href="{% url 'orderapp:order_delete' object.pk %}" class="btn-danger">
            Удалить
        </a>

    </div>

</div>

{% endif %}

<div class="actions-card secondary">

    <a href="{% url 'orderapp:order_list' %}" class="btn-secondary">
        ← К списку заказов
    </a>

    <a href="{% url 'main' %}" class="btn-secondary">
        На главную
    </a>

</div>
